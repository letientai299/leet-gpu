[tools]
"pipx:clang-format" = "23.1.1"
"pipx:gersemi" = "0.29.1"
rumdl = "0.2.73"
ruff = "0.16.8"
shfmt = "3.14.1"
shellcheck = "0.11.0"
watchexec = "latest"
prek = "latest"

[hooks]
postinstall = "prek --config .config/prek.toml install"

[env]
_.source = ".env"

[tasks."dc:run"]
description = "Exec a command in the running container (usage: mise dc:run -- <cmd>)"
usage = 'arg "<cmd>" var=#true'
run = 'eval "cmd=($usage_cmd)"; docker exec -it "$CONTAINER_NAME" "${cmd[@]}"'

[tasks."dc:down"]
description = "Stop the container"
run = 'docker stop "$CONTAINER_NAME"'

[tasks."clean:all"]
description = "Remove all generated outputs and dependencies"
run = ".config/mise/tasks/clean --all"
