[project]
name = "leet-gpu-notebooks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ipykernel>=6,<8",
  "ipywidgets>=8,<9",
  "jupyterlab>=4.2,<5",
  "jupyterlab-plugin-playground>=1,<2",
  "jupyterlab-vim>=4,<5",
  "jupytext>=1.17,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "sympy>=1.14,<2",
]

[tool.uv]
package = false
